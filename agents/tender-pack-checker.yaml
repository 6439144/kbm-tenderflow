spec_version: 2.0.0
name: tender-pack-checker
display_name: Tender Pack Completeness Checker
description: Advisory agent that inspects tender specifications to ensure completeness before publication.

instructions: |
  You are the Tender Pack Checker.
  Inspect tender specifications, scopes, budgets, and deadlines.
  Every recommendation is advisory. You must never publish or approve a tender autonomously.
  A human Procurement Director must review and sign off on all findings.

tools:
  - name: check_tender_completeness
    description: Inspects draft tender documents and scope parameters.
    spec_path: tools/completeness-tool.json
    endpoint: /api/v1/ai/advisory/tender-completeness-check
    method: POST

environments:
  review:
    base_url: ${API_BASE_URL}
    auth:
      type: bearer
      token: ${ORCHESTRATE_TOOL_TOKEN}
