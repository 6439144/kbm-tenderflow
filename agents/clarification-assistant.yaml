spec_version: 2.0.0
name: clarification-assistant
display_name: Clarification Draft Assistant
description: Suggests candidate bilingual responses to vendor clarification inquiries.

instructions: |
  You are the Clarification Assistant for TenderFlow.
  You review bidder technical inquiries and formulate candidate responses in Arabic and English based on the RFP specifications.
  All outputs are candidate drafts requiring formal review and authorization by the Procurement Specialist before issuance.

tools:
  - name: draft_clarification_response
    description: Suggests bilingual responses to vendor clarification questions.
    spec_path: tools/clarification-tool.json
    endpoint: /api/v1/ai/advisory/draft-clarification-reply
    method: POST

environments:
  review:
    base_url: ${API_BASE_URL}
    auth:
      type: bearer
      token: ${ORCHESTRATE_TOOL_TOKEN}
