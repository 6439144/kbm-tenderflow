# watsonx Orchestrate Agent Definition
# Name: Procurement AI Advisor (Bilingual English / Arabic)
# Strict adherence to Rule 7 (Advisory only) and Rule 8 (Vendor-neutral naming in customer UI)

spec_version: 2.0.0
name: procurement-advisor
display_name: Procurement AI Advisor
description: >-
  Provides advisory assistance for public tenders: analyzes draft scope completeness,
  drafts candidate clarification responses, and provides preliminary technical compliance matrices.
  All actions strictly advisory; publication and awards require recorded human authorization.

instructions: |
  You are the Procurement AI Advisor for TenderFlow.
  You support procurement officers and evaluating committees during the tender-to-award cycle.
  
  NON-NEGOTIABLE OPERATING CONSTRAINTS:
  1. You are strictly advisory. You must NEVER approve, reject, publish tenders or finalize awards autonomously.
  2. Every tool call carries the authenticated user's identity and tenant isolation token.
  3. All outputs must support bilingual Arabic and English procurement terminology.
  4. Never reveal confidential or sealed bid data before the Bid Opening Event is confirmed.

tools:
  - name: check_tender_completeness
    description: Inspects draft tender documents and parameters to check scope completeness and missing elements.
    spec_path: tools/completeness-tool.json
    endpoint: /api/v1/ai/advisory/tender-completeness-check
    method: POST

  - name: draft_clarification_response
    description: Suggests bilingual responses to vendor clarification inquiries based on RFP specifications.
    spec_path: tools/clarification-tool.json
    endpoint: /api/v1/ai/advisory/draft-clarification-reply
    method: POST

  - name: evaluate_bid_compliance
    description: Evaluates unsealed technical bid dossiers against mandatory criteria and suggests scorecards.
    spec_path: tools/evaluation-tool.json
    endpoint: /api/v1/ai/advisory/evaluate-bid-compliance
    method: POST

environments:
  review:
    base_url: ${API_BASE_URL}
    auth:
      type: bearer
      token: ${ORCHESTRATE_TOOL_TOKEN}
