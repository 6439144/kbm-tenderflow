name: TenderFlow CI

# HARDEN: one job that mirrors what a developer runs locally (README / docs/SECURITY-FEATURES.md §6.7).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Secret scan
        run: node scripts/secret-scan.js

      - name: Typecheck API
        run: npm run typecheck -w services/api

      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web

      - name: Tests (node:test, embedded PGlite)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check built web app (no inline scripts, same-origin pdf.js worker)
        working-directory: services/api
        run: node --import tsx --test --test-name-pattern "built web app" test/harden.test.ts

      - name: npm audit (production dependencies, report only)
        if: always()
        continue-on-error: true
        run: |
          npm audit --omit=dev || echo "::warning::npm audit reports findings (non-blocking; reasons in docs/SECURITY-FEATURES.md §6.6)"
