name: TenderFlow CI Pipeline

on:
  push:
    branches: [ integration ]
  pull_request:
    branches: [ integration ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Validation & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Security Scan (Rule 5: Zero Secrets)
        run: npm run scan:secrets

      - name: Workspace Lint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Workspaces
        run: npm run build

      - name: Unit & Integration Tests
        run: npm test

      - name: Security Penetration Tests (RBAC, Rule 1, Isolation)
        run: npm run test:security

      - name: 10-Step Review Demo E2E Tests
        run: npm run test:e2e

      - name: AI Advisory Benchmark Evals (Task T11)
        run: npm run test:evals

      - name: Generate CycloneDX SBOM (Task T01)
        run: npm run generate:sbom

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenderflow-sbom
          path: tenderflow-sbom.json

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || echo "Audited with non-blocking findings"

  docker-build:
    name: Container Build & Image Verification
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dev TLS Certs for Proxy
        run: |
          mkdir -p deploy/proxy/certs
          bash deploy/proxy/certs/generate-certs.sh

      - name: Build Docker Stack
        run: |
          docker compose -f deploy/docker-compose.yml build
