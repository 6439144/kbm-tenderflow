apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenderflow
  labels:
    app.kubernetes.io/name: tenderflow
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenderflow
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenderflow
        app.kubernetes.io/component: api
    spec:
      # >= SHUTDOWN_DELAY_MS + SHUTDOWN_TIMEOUT_MS + 10 s (the app exits on its own before SIGKILL)
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # No runAsUser / fsGroup: the restricted-v2 SCC assigns an arbitrary UID with group 0, which owns /data in the image.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tenderflow
                    app.kubernetes.io/component: api
      containers:
        - name: api
          image: tenderflow
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tenderflow-config
            - secretRef:
                name: tenderflow-secrets
          # Listens only after migrations (and, in the demo, the first-start seed) finish: allow up to 5 minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # Database reachable, all migrations applied, content store reachable. 503 while draining on SIGTERM.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Process alive (no database call), so a database outage never restarts every pod.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tenderflow-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
