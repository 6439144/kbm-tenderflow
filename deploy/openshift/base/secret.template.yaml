# TEMPLATE ONLY — placeholders, never real values. NOT referenced by kustomization.yaml, so it is never applied.
# Create the real Secret from a local env file that you never commit (README.md):
#
#   oc create secret generic tenderflow-secrets --from-env-file=tenderflow-secrets.env
#
# Generate keys with `npm run gen-keys -- --production`. With TF_ENV=production the API refuses to start while any
# value below is missing, weak or still a placeholder (`npm run config:check` shows every finding).
apiVersion: v1
kind: Secret
metadata:
  name: tenderflow-secrets
  labels:
    app.kubernetes.io/name: tenderflow
type: Opaque
stringData:
  # --- required ---
  BID_MASTER_KEY: "<base64 of 32 random bytes>"
  AUDIT_SIGNING_KEY: "<at least 32 random characters>"
  # RSA private key, at least 2048 bits, PKCS#8 PEM; one line with \n escapes is accepted
  JWT_PRIVATE_KEY_PEM: "<rsa private key pem>"
  # --- production overlay ---
  DATABASE_URL: "postgresql://<user>:<password>@<host>:5432/<database>"
  FILENET_GRAPHQL_URL: "https://<filenet-host>/content-services-graphql/graphql"
  FILENET_OBJECT_STORE: "<object store, e.g. OS1>"
  FILENET_SERVICE_USER: "<service user>"
  FILENET_SERVICE_PASSWORD: "<service password>"
  # --- optional ---
  MFA_ENC_KEY: "<base64 of 32 random bytes>"
  WXO_INSTANCE_URL: "<watsonx Orchestrate instance URL>"
  WXO_API_KEY: "<watsonx Orchestrate API key>"
  SMTP_PASS: "<smtp password>"
  SMS_HTTP_AUTH_HEADER: "<Authorization: Bearer ...>"
  # --- demo overlay only (refused in production) ---
  DEMO_PASSWORD: "<password of every demo user>"
