# Production: 2+ pods, PostgreSQL (DATABASE_URL in the Secret), IBM FileNet as the content store, TF_ENV=production
# (the API refuses to start on any unsafe setting — run `npm run config:check` with the same values first).
#   oc new-project tenderflow
#   oc create secret generic tenderflow-secrets --from-env-file=tenderflow-secrets.env
#   oc apply -k deploy/openshift/overlays/production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenderflow

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/instance: tenderflow
    includeSelectors: false

configMapGenerator:
  - name: tenderflow-config
    behavior: merge
    literals:
      - TF_ENV=production
      - TRUST_PROXY=1
      - DEMO_MODE=false
      - SEED_DEMO=false
      - CONTENT_STORE_TYPE=filenet
      - PUBLIC_BASE_URL=https://tenders.entity.example.gov.kw
      - NODE_OPTIONS=--max-old-space-size=1024

patches:
  - path: deployment-patch.yaml
  - path: pvc-patch.yaml

images:
  - name: tenderflow
    newName: image-registry.openshift-image-registry.svc:5000/tenderflow/tenderflow
    newTag: 1.0.0-rc3
