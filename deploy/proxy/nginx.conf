events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Upstreams for all TenderFlow stack services
    upstream api_service {
        server api:4000;
    }

    upstream vendor_portal {
        server vendor-portal:3000;
    }

    upstream procurement_app {
        server procurement-app:3001;
    }

    upstream control_panel {
        server control-panel:3002;
    }

    upstream keycloak_service {
        server keycloak:8080;
    }

    upstream mailpit_service {
        server mailpit:8025;
    }

    # -------------------------------------------------------------
    # HTTP Server: Redirect to HTTPS (Keep /health open for probes)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name localhost _;

        location /health {
            proxy_pass http://api_service/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------
    # HTTPS Server: TLS Reverse Proxy with strict security headers
    # -------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name localhost _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Health Probe
        location /health {
            proxy_pass http://api_service/health;
        }

        # REST API Gateway
        location /api/ {
            proxy_pass http://api_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Identity Provider (Keycloak)
        location /auth/ {
            proxy_pass http://keycloak_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Sandbox Email Web Interface
        location /mail/ {
            proxy_pass http://mailpit_service/;
            proxy_set_header Host $host;
        }

        # Procurement App
        location /procurement/ {
            proxy_pass http://procurement_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Admin Control Panel
        location /control-panel/ {
            proxy_pass http://control_panel/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Vendor Portal (Default Web Root)
        location / {
            proxy_pass http://vendor_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
