version: '3.8'

services:
  # -------------------------------------------------------------
  # Database: PostgreSQL 16 (Rule: Zero document bodies in PG)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tenderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenderflow_db
      POSTGRES_USER: tenderflow_user
      POSTGRES_PASSWORD: tenderflow_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../services/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderflow_user -d tenderflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Identity & Access Management: Keycloak (OIDC)
  # -------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tenderflow-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/tenderflow-realm.json:/opt/keycloak/data/import/tenderflow-realm.json:ro
    ports:
      - "8080:8080"

  # -------------------------------------------------------------
  # Email Sandbox: Mailpit
  # -------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: tenderflow-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

  # -------------------------------------------------------------
  # Core REST API (services/api)
  # -------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: tenderflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://tenderflow_user:tenderflow_password@postgres:5432/tenderflow_db
      CONTENT_STORE_TYPE: filesystem
      CONTENT_STORE_FS_PATH: /app/storage/content-store
      AUDIT_SIGNING_KEY: production_audit_signing_key_secret_090
      SEALED_BID_MASTER_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    volumes:
      - contentdata:/app/storage/content-store
    ports:
      - "4000:4000"

  # -------------------------------------------------------------
  # Vendor Portal (apps/vendor-portal - Port 3000)
  # -------------------------------------------------------------
  vendor-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        APP_DIR: vendor-portal
        APP_PORT: 3000
    container_name: tenderflow-vendor-portal
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3000:3000"

  # -------------------------------------------------------------
  # Procurement App (apps/procurement-app - Port 3001)
  # -------------------------------------------------------------
  procurement-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        APP_DIR: procurement-app
        APP_PORT: 3001
    container_name: tenderflow-procurement-app
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3001:3001"

  # -------------------------------------------------------------
  # Control Panel (apps/control-panel - Port 3002)
  # -------------------------------------------------------------
  control-panel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        APP_DIR: control-panel
        APP_PORT: 3002
    container_name: tenderflow-control-panel
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3002:3002"

  # -------------------------------------------------------------
  # TLS Reverse Proxy (deploy/proxy - Ports 80 & 443)
  # -------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: tenderflow-proxy
    restart: unless-stopped
    depends_on:
      - api
      - vendor-portal
      - procurement-app
      - control-panel
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
  contentdata:
